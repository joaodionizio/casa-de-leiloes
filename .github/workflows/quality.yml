name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, types, tests and browser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies from lockfile
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: npm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Backend lint and PostgreSQL integration tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://casa:casa_local_dev@127.0.0.1:5432/casa_de_leiloes_dev
      TEST_DATABASE_URL: postgresql://casa:casa_local_dev@127.0.0.1:5432/casa_de_leiloes_test
      APP_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - name: Validate backup script syntax
        run: bash -n scripts/backup-render-postgres.sh
      - uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install 3.13
      - name: Start isolated PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check .
      - name: Ruff formatting
        working-directory: backend
        run: uv run ruff format --check .
      - name: Pytest against real PostgreSQL
        working-directory: backend
        run: uv run pytest
